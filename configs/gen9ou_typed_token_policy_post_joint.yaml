# Policy is trained last from the jointly trained typed trunk, belief model, and value head.
# Human replay actions provide the dense action-ranking target.  The jointly trained trunk,
# belief model, and value head stay frozen in this first policy stage.  A preceding low-rate
# shared-trunk smoke slightly worsened the exact-simulator auxiliaries, so adaptation is deferred
# until live action-ranking evidence proves that the frozen representation is insufficient.
extends: gen9ou_typed_token_enhanced.yaml

experiment: gen9ou_typed_token_policy_post_joint
seed: 20261161
device: cuda

bc:
  manifest: runs/gen9ou_replay_policy_rating1650_v2/train_manifest.parquet
  holdout_manifest: runs/gen9ou_replay_policy_rating1650_v2/holdout_manifest.parquet
  max_primary_batches_per_epoch: 96
  init_ckpt: runs/gen9ou_typed_token_joint_belief_value_v1/checkpoints/bc_best.pt
  init_compatible: false
  scope: policy
  epochs: 16
  batch_size: 768
  lr: 2.0e-5
  lr_final: 2.0e-6
  eval_batches: 64
  early_stopping_patience: 4
  early_stopping_min_delta: 0.002
  streaming: true
  shard_buffer: 16

loss:
  action_coef: 1.0
  require_exact_chosen_action_features: true
  require_exact_chosen_legality: true
  belief_coef: 0.0
  belief_chain_coef: 0.0
  value_coef: 0.0
  self_belief_coef: 0.0
  self_belief_chain_coef: 0.0
  preview_coef: 0.0

preflight:
  required: true
  report: runs/preflight_audit/typed_token_policy_post_joint_v3/summary.json
  replay_report: runs/replay_preflight_audit/typed_token_policy_post_joint_v3/summary.json
  min_games: 5
  min_replay_dryruns: 10
  min_replay_hidden_targets: 1000
  min_parsed_replay_games: 5
  min_parsed_replay_dryruns: 10
  min_parsed_replay_rows: 200
  schema_version: 5
  replay_schema_version: 4
  match_source: true

log:
  dir: runs/gen9ou_typed_token_policy_post_joint_v1
  tensorboard: true
