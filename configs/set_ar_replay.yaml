# Optional partial-replay pretraining for the set-autoregressive opponent belief model.
#
# Use only with a large, rating-filtered replay corpus and compare against the G0-initialized
# no-replay arm on complete-team heldout likelihood and downstream search. Missing replay fields
# are selective, not random, so this is an auxiliary experiment rather than the primary objective.
extends: bc_ou.yaml

experiment: set_ar_replay
model:
  use_posterior_features: true
bc:
  manifest: data/parsed/manifest.parquet
  streaming: true
  shard_buffer: 64
  batch_size: 512
  epochs: 10
  init_ckpt: artifacts/checkpoints/g0_retained.pt
  init_compatible: true
  scope: belief
loss:
  action_coef: 0.0
  value_coef: 0.0
  belief_coef: 0.0
  belief_chain_coef: 1.0
  self_belief_coef: 0.0
  self_belief_chain_coef: 0.0
log:
  dir: runs/set_ar_replay
