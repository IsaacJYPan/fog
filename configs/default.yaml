# Base config. Every experiment yaml inherits these and overrides a subset.
# Every run is fully reproducible from (this resolved config + seed). The loader records a config hash.

seed: 0
device: cuda
mixed_precision: true

# --- Pinned external sources (reproducibility; §0) -------------------------------------------------
pins:
  showdown_commit: e440c4a18385274f10c405d0b158b6a962ce6d94
  ou_banlist_date: "2026-06"   # metagame snapshot the usage month corresponds to
  usage_month: "2026-06"       # Smogon chaos month (data/usage + generated spreads/priors)
  usage_rating_cut: 1695       # gen9ou chaos rating bucket

# --- Simulator / environment (§0, §10 M0) ----------------------------------------------------------
env:
  # Direct is the default research backend: Showdown is imported in-process through a persistent
  # local worker, while observations still pass through poke-env's ordinary censored parser.
  # The server URL remains below only for external/live-play compatibility.
  backend: showdown_direct       # {showdown_direct, showdown, engine}
  showdown_root: server/pokemon-showdown
  server_url: "ws://localhost:8000/showdown/websocket"
  battle_format: "gen9ou"
  num_workers: 8               # legacy server-backed M0 throughput probe
  no_security: true            # legacy local-server flag
  team_pool: null              # path to a parsed team bank; null = format default
  # Concurrent battles per player on env.backend=showdown (poke-env max_concurrent_battles).
  # showdown_direct currently schedules complete games synchronously through one worker. Per-battle
  # state is keyed by battle_tag so >1 is safe; note >1 switches belief-truth from the exact
  # recording-teambuilder source to attribute matching (labels missing until reveals disambiguate).
  concurrent_battles: 1

# --- Encoding (§2) ---------------------------------------------------------------------------------
encoding:
  history_cap: 60              # turns; pad/truncate from the front
  history_encoder: gru         # {gru, transformer}
  species_embed_dim: 64
  entity_hidden: 128
  state_dim: 256               # s_board width (policy inputs (a)+(b): static entity/board summary)
  dyn_dim: 256                 # c_dyn width (input (c): dynamics vector; also the belief memory)

# --- Model (§3) ------------------------------------------------------------------------------------
model:
  entity_transformer_layers: 2
  entity_heads: 4
  history_gru_hidden: 256
  belief_decoder_layers: 2     # legacy key; current set-AR team encoder is two layers
  belief_dim: 128              # belief/self-belief set-encoder width d
  aux_into_trunk: true         # belief/self-belief losses backprop into backbone (shapes c_dyn; §3.6)
  oracle: none                 # {none, set, action} — §3.4 evaluation ceilings

# --- Losses / training shared ----------------------------------------------------------------------
loss:
  value_coef: 0.5
  belief_coef: 1.0              # marginal CE: calibrates the diagnostic/leakage marginal forward (§8.2)
  self_belief_coef: 1.0
  belief_chain_coef: 1.0        # matched set-AR next-field CE; shapes c_dyn (§3.6)
  self_belief_chain_coef: 1.0
  preview_coef: 0.5

# --- Logging ---------------------------------------------------------------------------------------
log:
  dir: runs
  tensorboard: true
  checkpoint_every_decisions: 200000
  halt_on_regression_sigma: 2.0
