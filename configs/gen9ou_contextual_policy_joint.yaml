# Stage 4b: allow a small final policy-driven adjustment of the shared trunk while preserving facts.
extends: gen9ou_contextual_heads.yaml

experiment: gen9ou_contextual_policy_joint
seed: 20261113
device: cuda

bc:
  manifest: runs/gen9ou_replay_policy_rating1650_v2/train_manifest.parquet
  holdout_manifest: runs/gen9ou_replay_policy_rating1650_v2/holdout_manifest.parquet
  holdout_fraction: 0.0
  init_ckpt: runs/gen9ou_contextual_policy_head_v1/checkpoints/bc_best.pt
  init_compatible: false
  scope: policy_shared
  epochs: 4
  batch_size: 1536
  lr: 1.0e-5
  lr_final: 1.0e-6
  shared_lr_scale: 0.05
  reconstruction_decoder: runs/gen9ou_contextual_trunk_v4_frozen_decoder_diagnostic/decoder_best.pt
  reconstruction_slot_dim: 512
  reconstruction_coef: 0.1
  eval_batches: 0
  early_stopping_patience: 2
  early_stopping_min_delta: 0.001
  streaming: true
  shard_buffer: 16

loss:
  action_coef: 1.0
  value_coef: 0.0
  belief_coef: 0.0
  belief_chain_coef: 0.0
  self_belief_coef: 0.0
  self_belief_chain_coef: 0.0
  preview_coef: 0.0

log:
  dir: runs/gen9ou_contextual_policy_joint_v1
  tensorboard: true
