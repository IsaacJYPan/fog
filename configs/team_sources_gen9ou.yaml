# RMT index pages are only a discovery queue. Titles must claim >=1850 Elo, top 200, >=80 GXE, or
# OLT qualification; the collector then scores replay/evidence signals and still requires a complete
# legal paste. Keep RMT-derived teams distinguishable in manifest.json for later manual review.
