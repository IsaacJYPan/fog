# Tournament/resource threads contribute only exact Pokepaste links that their authors chose to
# publish. Replays are evidence metadata, never a source for guessing hidden sets. Older pastes are
# harmless to discovery: the pinned current Showdown validator rejects obsolete/illegal teams.
