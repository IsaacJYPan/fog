# Archived M4 self-play volume run on the poke-engine backend.
# Same experiment as m4_ou_selfplay.yaml, ~13x the measured throughput (engine_runner --probe).
# Run fuzz_sim --showdown on the pool first; the cross-sim gauntlet below HALTS on a
# >3% engine-vs-Showdown win-rate gap; the final ~200k games + every headline eval stay on
# Showdown (switch back with env.backend=showdown, warm-started from this run's checkpoint).
#   python -m fog.training.ppo --config configs/archive/m4_ou_selfplay_engine.yaml
extends: m4_ou_selfplay.yaml

experiment: m4_ou_selfplay_engine
env:
  backend: engine
  engine_batch: 64                 # lockstep battles per wave; probe showed saturation ~32-128
league:
  scripted: [MaxDamage, Random]    # engine ports; SimpleHeuristics is Showdown-only (eval there)
cross_sim:
  every_decisions: 100000          # divergence gauntlet cadence (0 = off; needs a live server)
  games: 200                       # per backend, vs MaxDamage
  halt_gap: 0.03                   # |engine WR - showdown WR| beyond this = policy farms sim bugs
log:
  dir: runs/m4_ou_selfplay_engine
