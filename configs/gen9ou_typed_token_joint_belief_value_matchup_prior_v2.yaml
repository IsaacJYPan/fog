# Causal correction to v1.  Combining initial-soft rows inside the ordinary exact source left
# their value objective unprotected; replay and the initial guard regressed monotonically.  Keep
# replay, hard exact simulation, and initial-soft value as three separately normalized PCGrad
# tasks in the same optimizer update.
extends: gen9ou_typed_token_joint_belief_value_matchup_prior_v1.yaml

experiment: gen9ou_typed_token_joint_belief_value_matchup_prior_v2
seed: 20261305

bc:
  auxiliary_manifest: runs/gen9ou_simple_belief_value_combined_v1/train_manifest.parquet
  guard_train_manifest: runs/gen9ou_simple_bv_repeat_train_initial_soft_16384_v2/train_manifest.parquet
  guard_train_value_only: true

preflight:
  report: runs/preflight_audit/typed_token_joint_belief_value_matchup_prior_v2/summary.json
  replay_report: runs/replay_preflight_audit/typed_token_joint_belief_value_matchup_prior_v2/summary.json

log:
  dir: runs/gen9ou_typed_token_joint_belief_value_matchup_prior_v2
  tensorboard: true
