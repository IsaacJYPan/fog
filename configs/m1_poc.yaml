# M1 — Confined-space PoC on the shared-core POOL-A: policy/value only (no belief net).
# Pure self-play PPO from scratch. Debugs PPO / league / encoder / dashboard cheaply.
#   python -m fog.training.ppo --config configs/m1_poc.yaml
extends: default.yaml

experiment: m1_poc
env:
  battle_format: gen9ou
  team_pool: data/teams/pool_a      # shared-species core, varied sets
model:
  use_belief_vec: false             # M1: no belief conditioning
loss:
  belief_coef: 0.0                  # belief head off at M1
  value_coef: 0.5
ppo:
  total_decisions: 200000
  batch_decisions: 8000
  minibatch_size: 1024
  games_per_chunk: 8
  epochs: 3
  clip: 0.2
  lr: 1.0e-4
  gamma: 1.0
  lam: 0.95
  entropy_coef: 0.02
  entropy_coef_final: 0.005
league:
  snapshot_every_decisions: 50000
log:
  dir: runs/m1_poc
gate:
  vs_max_damage: 0.75
  vs_simple_heuristics: 0.60
