# Evidence-backed lower-rate continuation after the EV-stat architecture fixed the previous
# exchangeability bug and was still improving at its final epoch. Move-set-aware evaluation shows
# genuine gains without requiring a new move head; the shared trunk remains conservatively scaled.
extends: gen9ou_typed_token_joint_belief_value_ev_stat_v2.yaml

experiment: gen9ou_typed_token_joint_belief_value_ev_stat_continuation_v3
seed: 20261226

bc:
  init_ckpt: runs/gen9ou_typed_token_joint_belief_value_ev_stat_v2/checkpoints/bc_best.pt
  init_compatible: false
  epochs: 48
  lr: 3.0e-6
  lr_final: 3.0e-7
  shared_lr_scale: 0.1
  early_stopping_patience: 12
  early_stopping_min_delta: 0.0005

preflight:
  report: runs/preflight_audit/typed_token_joint_belief_value_ev_stat_continuation_v3/summary.json
  replay_report: runs/replay_preflight_audit/typed_token_joint_belief_value_ev_stat_continuation_v3/summary.json

log:
  dir: runs/gen9ou_typed_token_joint_belief_value_ev_stat_continuation_v3
  tensorboard: true
