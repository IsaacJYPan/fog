# M2 — Set-oracle and action-oracle ceilings on POOL-A (§3.4). One flag each; measures the gaps.
# Train a set-oracle agent (perfect opponent info) and an action-oracle agent, compare to the
# M1.5 N-agent. Gate: oracle >= N-agent (sanity); record both gaps.
#   python -m fog.training.ppo --config configs/m2_oracle.yaml            # set oracle
#   python -m fog.training.ppo --config configs/m2_oracle.yaml --set model.oracle=action
extends: m1_5_belief.yaml

experiment: m2_oracle
model:
  oracle: set                       # {set, action} — see §3.4; the set oracle needs opp truth tokens
                                    # in the batch (self-play provides them via the pool-truth match)
log:
  dir: runs/m2_oracle
