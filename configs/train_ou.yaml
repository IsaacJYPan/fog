# Gen9OU self-play PPO on the POOL-B team bank.
# Uses env.backend=showdown_direct from default.yaml: no server, login, or WebSocket is started.
# Run: python -m fog.training.ppo --config configs/train_ou.yaml
extends: default.yaml

experiment: train_ou

env:
  battle_format: gen9ou
  team_pool: data/teams/pool_b   # validate after edits: fog.env.teams.validate_pool

ppo:
  total_decisions: 500000
  batch_decisions: 4096          # frequent updates help spot early collapse
  minibatch_size: 512
  epochs: 3
  clip: 0.2
  lr: 1.0e-4
  gamma: 1.0
  lam: 0.95
  entropy_coef: 0.01
  games_per_chunk: 8

leakage:
  beta: 0.0                      # no leakage penalty

league:
  snapshot_every_decisions: 50000

log:
  dir: runs/train_ou

gate:                            # historical evaluation thresholds
  vs_max_damage: 0.75
  vs_simple_heuristics: 0.60
