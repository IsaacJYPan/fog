# Long joint representation curriculum.  Policy is deliberately frozen.
# Each epoch sees comparable numbers of realistic censored replay states and exact-truth
# Simple-vs-Simple simulator states.  Worst-relative heldout selection prevents either source
# from improving by sacrificing the other.
extends: gen9ou_typed_token_enhanced.yaml

experiment: gen9ou_typed_token_joint_belief_value_overnight
seed: 20261169
device: cuda

bc:
  manifest: runs/gen9ou_replay_policy_rating1650_v2/train_manifest.parquet
  holdout_manifest: runs/gen9ou_replay_policy_rating1650_v2/holdout_manifest.parquet
  auxiliary_manifest: runs/gen9ou_simple_belief_value_4096_v1/train_manifest.parquet
  auxiliary_holdout_manifest: runs/gen9ou_simple_belief_value_4096_v1/holdout_manifest.parquet
  auxiliary_every_primary_batches: 1
  auxiliary_eval_weight: 1.0
  auxiliary_eval_batches: 0
  max_primary_batches_per_epoch: 160
  init_ckpt: runs/gen9ou_typed_token_joint_belief_value_v1/checkpoints/bc_best.pt
  init_compatible: false
  scope: belief_value_shared
  epochs: 48
  batch_size: 768
  lr: 1.0e-5
  lr_final: 1.0e-6
  shared_lr_scale: 0.10
  eval_batches: 64
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  streaming: true
  shard_buffer: 16

loss:
  action_coef: 0.0
  belief_coef: 0.15
  belief_chain_coef: 0.15
  value_coef: 1.0
  self_belief_coef: 0.0
  self_belief_chain_coef: 0.0
  preview_coef: 0.0

preflight:
  required: true
  report: runs/preflight_audit/typed_token_joint_belief_value_overnight_v1/summary.json
  replay_report: runs/replay_preflight_audit/typed_token_joint_belief_value_overnight_v1/summary.json
  min_games: 5
  min_replay_dryruns: 10
  min_replay_hidden_targets: 1000
  min_parsed_replay_games: 5
  min_parsed_replay_dryruns: 10
  min_parsed_replay_rows: 200
  schema_version: 5
  replay_schema_version: 4
  match_source: true

log:
  dir: runs/gen9ou_typed_token_joint_belief_value_overnight_v1
  tensorboard: true
