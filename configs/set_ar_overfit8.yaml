# Replay-censored diagnostic run on POOL-A's eight same-preview, different-hidden-set teams.
#
# The experiment is intentionally easier than open-OU play. It asks whether the observation
# history and set-autoregressive belief chain can exploit repeated complete-truth supervision to
# identify recoverable hidden facts. Species preview is identical across candidates. The simulator's
# complete paste is used only to disambiguate the value of facts independently observed in the
# public protocol; unrevealed fields remain -1 and never enter the loss.
#
# Authoritative evaluation:
#   python -m fog.eval.pool_id --config configs/set_ar_overfit8.yaml \
#     --ckpt runs/set_ar_overfit8/checkpoints/ppo_final.pt \
#     --actor-ckpt runs/set_ar_smoke_v2/checkpoints/ppo_final.pt \
#     --pool data/teams/pool_a --games 32 \
#     --out runs/set_ar_overfit8/pool_id_showdown.json
#
# Interpret the result with the hard-filter baseline and uniquely-identifiable subset:
#   * >= 0.80 exact team top-1 at the last decision through turn 4 (the existing M1.5 gate);
#   * 1.00 top-1 where explicit reveals leave one candidate (an evaluator integrity check);
#   * improving top-1 above 1/K while K>1 (the actual learned inference signal);
#   * rising true-team probability and falling posterior entropy as turns/reveals accumulate.
extends: set_ar_train.yaml

experiment: set_ar_overfit8
env:
  backend: showdown_direct
  team_pool: data/teams/pool_a
  belief_supervision: replay_censored
  # Diagnostic truth labels should not acquire a spurious pool prior from small random batches.
  balanced_team_sampling: true
ppo:
  # Reinitialize only redesigned/incompatible tensors from the retained G0 checkpoint.
  init_ckpt: artifacts/checkpoints/g0_retained.pt
  init_compatible: true
  total_decisions: 16000
  batch_decisions: 1000
  minibatch_size: 250
  games_per_chunk: 4
  epochs: 4
  # The first 3e-4 probe produced a 0.035 KL spike and unstable candidate ranking. This lower
  # rate keeps the memorization test focused on representational capacity rather than PPO damage.
  lr: 1.0e-4
  entropy_coef: 0.005
  entropy_coef_final: 0.001
league:
  # Keep opponent behavior fixed during this diagnostic; pool identity remains uniformly sampled
  # independently for every game.
  scripted: [MaxDamage]
  snapshot_every_decisions: 20000
loss:
  belief_coef: 1.0
  belief_chain_coef: 2.0
  self_belief_coef: 0.5
  self_belief_chain_coef: 0.5
log:
  dir: runs/set_ar_overfit8
  tensorboard: false
