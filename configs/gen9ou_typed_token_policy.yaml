extends: gen9ou_typed_token_trunk.yaml

experiment: gen9ou_typed_token_policy
seed: 20261121
device: cuda

bc:
  manifest: runs/gen9ou_replay_policy_rating1650_v2/train_manifest.parquet
  holdout_manifest: runs/gen9ou_replay_policy_rating1650_v2/holdout_manifest.parquet
  holdout_fraction: 0.0
  init_ckpt: runs/gen9ou_typed_token_value_v1/checkpoints/bc_best.pt
  init_compatible: false
  scope: policy_shared
  epochs: 12
  batch_size: 768
  lr: 3.0e-5
  lr_final: 3.0e-6
  shared_lr_scale: 0.1
  eval_batches: 0
  early_stopping_patience: 4
  early_stopping_min_delta: 0.002
  streaming: true
  shard_buffer: 16

loss:
  action_coef: 1.0
  # The action recorded in the replay is exact. Exclude the tiny number of rows where the
  # reconstructed chosen-candidate features or legality are not also exact. The three plausible
  # own-private sets remain deliberate uncertainty augmentation, not claimed ground truth.
  require_exact_chosen_action_features: true
  require_exact_chosen_legality: true
  value_coef: 0.05
  belief_coef: 0.05
  belief_chain_coef: 0.05
  self_belief_coef: 0.0
  self_belief_chain_coef: 0.0
  preview_coef: 0.0

log:
  dir: runs/gen9ou_typed_token_policy_v1
  tensorboard: true

preflight:
  required: true
  report: runs/preflight_audit/typed_token_v7/summary.json
  replay_report: runs/replay_preflight_audit/typed_token_v7/summary.json
  min_games: 5
  min_replay_dryruns: 10
  min_replay_hidden_targets: 1000
  min_parsed_replay_games: 5
  min_parsed_replay_dryruns: 10
  min_parsed_replay_rows: 200
  schema_version: 5
  replay_schema_version: 4
  match_source: true
