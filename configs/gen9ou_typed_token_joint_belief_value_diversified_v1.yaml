# Production continuation after causal diagnosis. High-rated censored replays remain the primary
# source. The exact Simple-vs-Simple auxiliary is 69% coherent hand-built teams and 31%
# usage-sampled set variants by row; variants provide move/EV/set-identity coverage without
# replacing realistic team structure. Global PCGrad protects both sources in one optimizer step.
extends: gen9ou_typed_token_joint_belief_value_pcgrad_continuation_v2.yaml

experiment: gen9ou_typed_token_joint_belief_value_diversified_v1
seed: 20261209

