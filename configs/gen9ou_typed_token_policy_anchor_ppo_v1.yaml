extends: gen9ou_typed_token_policy_post_matchup_prior_v1.yaml

# Outcome-directed bridge after replay BC and teacher imitation both improved cross-entropy while
# failing the live SimpleHeuristics gate.  This is deliberately NOT self-play: a fixed, visible-
# information SimpleHeuristics anchor supplies a stationary reward curriculum.  The accepted
# trunk/belief/matchup prior remain frozen; only candidate-query policy and ordinary value adapters
# move.  A frozen BC anchor limits distribution collapse during this bounded 24k-decision probe.
experiment: gen9ou_typed_token_policy_anchor_ppo_v1
seed: 20261313

# Replay provenance audit loads bc.init_ckpt. Point it at the same current architecture instead of
# inheriting the historical pre-EV-stat checkpoint from the original policy-BC config.
bc:
  init_ckpt: runs/gen9ou_typed_token_policy_post_matchup_prior_v1/checkpoints/bc_best.pt
  init_compatible: false

env:
  backend: showdown_direct
  showdown_root: server/pokemon-showdown
  battle_format: gen9ou
  team_pool: data/teams/gen9ou_public_v1/train.json
  rollout_workers: 4
  rollout_worker_mode: process
  actor_threads: 2
  opponent_cache_size: 2

ppo:
  total_decisions: 24000
  batch_decisions: 6000
  minibatch_size: 768
  games_per_chunk: 8
  epochs: 1
  clip: 0.05
  lr: 2.0e-6
  entropy_coef: 0.003
  entropy_coef_final: 0.002
  rollout_temperature: 1.0
  rollout_tera_logit_bonus: 0.0
  init_ckpt: runs/gen9ou_typed_token_policy_post_matchup_prior_v1/checkpoints/bc_best.pt
  init_compatible: false
  bc_anchor_ckpt: runs/gen9ou_typed_token_policy_post_matchup_prior_v1/checkpoints/bc_best.pt
  kl_anchor_decisions: 24000
  kl_anchor_coef: 0.05
  trainable_prefixes:
    - policy_value.action_query_
    - policy_value.value.
    - shared_to_value.

league:
  snapshot_every_decisions: 6000
  warmup_decisions: 0
  latest_frac: 0.0
  past_frac: 0.0
  scripted_frac: 1.0
  past_ckpts: []
  scripted: [SimpleHeuristics]

loss:
  action_coef: 1.0
  value_coef: 0.5
  belief_coef: 0.0
  belief_chain_coef: 0.0
  self_belief_coef: 0.0
  self_belief_chain_coef: 0.0
  preview_coef: 0.0

replay_policy:
  manifest: runs/gen9ou_replay_policy_rating1650_v2/train_manifest.parquet
  coef: 0.001
  batch_size: 768
  steps_per_update: 1
  shard_buffer: 16

preflight:
  required: true
  report: runs/preflight_audit/typed_token_policy_anchor_ppo_v5/summary.json
  replay_report: runs/replay_preflight_audit/typed_token_policy_anchor_ppo_v5/summary.json
  min_games: 5
  min_replay_dryruns: 10
  min_replay_hidden_targets: 1000
  min_parsed_replay_games: 5
  min_parsed_replay_dryruns: 10
  min_parsed_replay_rows: 200
  schema_version: 5
  replay_schema_version: 4
  match_source: true

log:
  dir: runs/gen9ou_typed_token_policy_anchor_ppo_v1
  tensorboard: true
  checkpoint_every_decisions: 6000
