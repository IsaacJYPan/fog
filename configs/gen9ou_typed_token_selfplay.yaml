extends: gen9ou_typed_token_live.yaml

experiment: gen9ou_typed_token_selfplay
seed: 20261140

ppo:
  total_decisions: 240000
  batch_decisions: 24000
  minibatch_size: 1536
  games_per_chunk: 16
  epochs: 1
  clip: 0.05
  lr: 1.0e-5
  entropy_coef: 0.003
  entropy_coef_final: 0.001
  rollout_temperature: 1.0
  rollout_tera_logit_bonus: 0.0
  # The automated job always replaces this with its current learner.
  init_ckpt: runs/gen9ou_typed_token_policy_v1_continuation/checkpoints/bc_best.pt
  init_compatible: false

league:
  snapshot_every_decisions: 24000
  warmup_decisions: 0
  latest_frac: 0.50
  past_frac: 0.40
  scripted_frac: 0.10
  past_ckpts: []
  scripted: [SimpleHeuristics, MaxDamage]

# Preserve dense shared-world supervision without letting auxiliary tasks dominate win/loss play.
loss:
  action_coef: 1.0
  value_coef: 0.5
  belief_coef: 0.02
  belief_chain_coef: 0.02
  self_belief_coef: 0.01
  self_belief_chain_coef: 0.01
  preview_coef: 0.0

# Human actions are a weak anti-forgetting signal. They are not the optimization target.
replay_policy:
  manifest: runs/gen9ou_replay_policy_rating1650_v2/train_manifest.parquet
  coef: 0.001
  batch_size: 1536
  steps_per_update: 1
  shard_buffer: 16

preflight:
  required: true
  report: runs/preflight_audit/typed_token_autonomous_v1/summary.json
  replay_report: runs/replay_preflight_audit/typed_token_autonomous_v1/summary.json
  min_games: 5
  min_replay_dryruns: 10
  min_replay_hidden_targets: 1000
  min_parsed_replay_games: 5
  min_parsed_replay_dryruns: 10
  min_parsed_replay_rows: 200
  schema_version: 5
  replay_schema_version: 4
  match_source: true
