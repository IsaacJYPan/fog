[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fog"
version = "0.0.1"
description = "A Gen 9 OU battle agent for experiments in hidden-team inference and search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FOG" }]

# uv.lock pins the development and experiment environment.
dependencies = [
    "torch>=2.2",            # CUDA build installed separately per platform
    "poke-env>=0.8",
    "poke-engine==0.0.48",   # search/training simulator; mechanics are cross-checked vs Showdown
    "numpy>=1.26",
    "polars>=0.20",
    "pyarrow>=15",
    "pyyaml>=6",
    "tensorboard>=2.16",
    "aiohttp>=3.9",          # replay scraping
    "scikit-learn>=1.4",     # spread clustering
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
fog-build-constants = "fog.scripts.build_constants:main"
fog-scrape          = "fog.scripts.scrape_replays:main"
fog-parse           = "fog.scripts.parse_replays:main"
fog-collect-teams   = "fog.scripts.collect_team_bank:main"
fog-train-auto      = "fog.scripts.automated_training:main"
fog-train-run       = "fog.train:main"
fog-checkpoint-cleanup = "fog.scripts.checkpoint_cleanup:main"

[tool.setuptools.packages.find]
include = ["fog*"]

[tool.setuptools.package-data]
fog = ["env/*.js"]

[tool.uv]
# poke-engine's default Cargo feature is an older battle generation. The Gen 9 build changes
# type interactions, critical-hit rates, Terastallization, and other mechanics. Always compile
# this dependency from source with exactly the generation this project studies.
no-binary-package = ["poke-engine"]
config-settings-package = { poke-engine = { build-args = "--features poke-engine/gen9 --no-default-features" } }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["server"]  # vendored Showdown checkout — not our code

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
cache_dir = ".pytest-cache-local"
